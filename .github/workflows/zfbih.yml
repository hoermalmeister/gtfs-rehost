name: GTFS Build - ZFBiH

# Every two weeks (1st and 15th of the month) + manual run
on:
  schedule:
    - cron: '0 8 1,15 * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      issues: write

    env:
      FEED_FOLDER: zfbih
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas playwright
          python -m playwright install --with-deps chromium

      - name: Build feed from zfbh.ba (all station pairs)
        id: build
        continue-on-error: true
        run: python .github/scripts/build_zfbih.py ${{ env.FEED_FOLDER }} --workers 6

      - name: Build ŽRS part from zrs-rs.com (Playwright)
        id: build_zrs
        continue-on-error: true
        run: python .github/scripts/build_zrs.py ${{ env.FEED_FOLDER }}

      - name: Keep raw answers for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zfbih-observations
          path: |
            zfbih_observations.json
            zrs_observations.json
          if-no-files-found: ignore

      - name: Notify via GitHub Issue (build problem / needs check)
        if: steps.build.outcome != 'success' || steps.build_zrs.outcome != 'success' || hashFiles('zfbih_alert.txt') != '' || hashFiles('zrs_alert.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Automated Alert: ${{ env.FEED_FOLDER }} GTFS build needs attention"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=""
          if [ -f zfbih_alert.txt ]; then BODY="$(cat zfbih_alert.txt)"; fi
          if [ -f zrs_alert.txt ]; then BODY="$BODY"$'\n\n'"$(cat zrs_alert.txt)"; fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then BODY="$BODY"$'\n\n'"ŽFBH: skript selhal – $RUN"; fi
          if [ "${{ steps.build_zrs.outcome }}" != "success" ]; then BODY="$BODY"$'\n\n'"ŽRS: skript selhal – $RUN"; fi
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            gh issue comment $EXISTING --body "$BODY"
          fi
          rm -f zfbih_alert.txt zrs_alert.txt

      - name: Check feed expiry
        run: |
          cd ${{ env.FEED_FOLDER }}
          python $GITHUB_WORKSPACE/.github/scripts/check_expiry.py ${{ env.FEED_FOLDER }}

      - name: Notify via GitHub Issue (GTFS Expiry)
        if: hashFiles('expiry_alert.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Automated Alert: ${{ env.FEED_FOLDER }} GTFS Feed Expiring"
          BODY=$(cat expiry_alert.txt)
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          rm expiry_alert.txt

      - name: Commit updated feed
        if: steps.build.outcome == 'success' || steps.build_zrs.outcome == 'success'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ${{ env.FEED_FOLDER }}
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update ${{ env.FEED_FOLDER }} GTFS" -m "$(cat zfbih_report.txt zrs_report.txt 2>/dev/null)"
            git push
          fi
