name: GTFS Build - BUK Bystrzyca Kłodzka

# Every two weeks (1st and 15th of the month) + manual run
on:
  schedule:
    - cron: '0 7 1,15 * *'
  workflow_dispatch:
  push:
    branches: [buk-gtfs]

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    env:
      FEED_FOLDER: buk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Build feed from bukbystrzyca.pl/rozklad-jazdy-probny
        id: build
        continue-on-error: true
        run: python .github/scripts/build_buk.py ${{ env.FEED_FOLDER }}

      - name: Notify via GitHub Issue (build problem)
        if: steps.build.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Automated Alert: ${{ env.FEED_FOLDER }} GTFS build needs attention"
          if [ -f buk_alert.txt ]; then BODY=$(cat buk_alert.txt); else BODY="Build script failed – see run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            gh issue comment $EXISTING --body "$BODY"
          fi
          rm -f buk_alert.txt

      - name: Check feed expiry
        run: |
          cd ${{ env.FEED_FOLDER }}
          python $GITHUB_WORKSPACE/.github/scripts/check_expiry.py ${{ env.FEED_FOLDER }}

      - name: Notify via GitHub Issue (GTFS Expiry)
        if: hashFiles('expiry_alert.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Automated Alert: ${{ env.FEED_FOLDER }} GTFS Feed Expiring"
          BODY=$(cat expiry_alert.txt)
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          rm expiry_alert.txt

      - name: Commit updated feed
        if: steps.build.outcome == 'success'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ${{ env.FEED_FOLDER }}
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update ${{ env.FEED_FOLDER }} GTFS" -m "$(cat buk_report.txt)"
            git push
          fi
